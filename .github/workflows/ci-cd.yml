name: CI Inventory

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: PHP Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, pdo_mysql, gd, mbstring, json
          coverage: none

      - name: Check PHP Syntax
        shell: bash
        run: |
          echo "=== CHECKING PHP SYNTAX ==="

          ERRORS=0

          while IFS= read -r file; do
            echo "Checking: $file"

            if ! php -l "$file"; then
              ERRORS=$((ERRORS+1))
            fi
          done < <(
            find . \
              -type f \
              -name "*.php" \
              -not -path "./.git/*" \
              -not -path "./vendor/*"
          )

          if [ "$ERRORS" -ne 0 ]; then
            echo ""
            echo "PHP syntax check failed with $ERRORS error(s)."
            exit 1
          fi

          echo ""
          echo "All PHP files have valid syntax."
